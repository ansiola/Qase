name: Qase Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    
    # Альтернативный способ установки Chrome (без сторонних actions)
    - name: Install Chrome
      run: |
        wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
        sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable
        google-chrome --version
    
    - name: Install ChromeDriver
      run: |
        CHROME_VERSION=$(google-chrome --version | awk '{print $3}')
        CHROMEDRIVER_VERSION=$(curl -s https://chromedriver.storage.googleapis.com/LATEST_RELEASE_${CHROME_VERSION%.*.*})
        wget https://chromedriver.storage.googleapis.com/$CHROMEDRIVER_VERSION/chromedriver_linux64.zip
        unzip chromedriver_linux64.zip
        sudo mv chromedriver /usr/local/bin/
        chromedriver --version
    
    - name: Setup Xvfb
      run: |
        sudo apt-get install -y xvfb
        Xvfb :99 -screen 0 1920x1080x24 &
        echo "DISPLAY=:99" >> $GITHUB_ENV
    
    - name: Create config file
      run: |
        mkdir -p src/test/resources
        cat > src/test/resources/config.properties << EOF
        google.login=${{ secrets.GOOGLE_LOGIN }}
        google.password=${{ secrets.GOOGLE_PASSWORD }}
        allure.results.directory=target/allure-results
        allure.link.issue.pattern=https://example.ru/issue/{}
        allure.link.tms.pattern=https://example.ru/tms/{}
        junit.jupiter.execution.parallel.enabled=false
        junit.jupiter.testinstance.lifecycle.default=per_method
        EOF
    
    - name: Run tests
      run: mvn clean test
    
    - name: Upload reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: |
          target/surefire-reports/
          target/allure-results/
          target/site/allure-maven-plugin/
