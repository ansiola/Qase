name: Qase Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    
    - name: Setup Chrome
      run: |
        sudo apt-get update
        sudo apt-get install -y wget
        wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
        sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
        sudo apt-get update
        sudo apt-get install -y google-chrome-stable
        google-chrome --version
    
    - name: Setup ChromeDriver
      run: |
        CHROME_VERSION=$(google-chrome --version | awk '{print $3}')
        CHROME_MAJOR_VERSION=${CHROME_VERSION%.*.*}
        wget -q "https://edgedl.me.gvt1.com/edgedl/chrome/chrome-for-testing/${CHROME_VERSION}/linux64/chromedriver-linux64.zip"
        unzip -q chromedriver-linux64.zip
        sudo mv chromedriver-linux64/chromedriver /usr/local/bin/
        sudo chmod +x /usr/local/bin/chromedriver
        chromedriver --version
    
    - name: Setup Xvfb
      run: |
        sudo apt-get install -y xvfb
        Xvfb :99 -screen 0 1920x1080x24 > /dev/null 2>&1 &
        echo "DISPLAY=:99" >> $GITHUB_ENV
    
    - name: Verify project structure
      run: |
        echo "=== Проверка структуры проекта ==="
        ls -la src/test/java/qase/tests/
        cat src/test/java/qase/tests/QaseProjectTest.java | head -20
    
    - name: Create config.properties
      run: |
        mkdir -p src/test/resources
        cat > src/test/resources/config.properties << 'EOF'
        google.login=${{ secrets.GOOGLE_LOGIN }}
        google.password=${{ secrets.GOOGLE_PASSWORD }}
        allure.results.directory=target/allure-results
        allure.link.issue.pattern=https://example.ru/issue/{}
        allure.link.tms.pattern=https://example.ru/tms/{}
        junit.jupiter.execution.parallel.enabled=false
        junit.jupiter.testinstance.lifecycle.default=per_method
        EOF
        echo "=== config.properties создан ==="
        cat src/test/resources/config.properties | grep -v password
    
    - name: Run tests
      run: |
        mvn clean compile
        mvn test -Dtest=QaseProjectTest
      continue-on-error: true
    
    - name: Check test results
      run: |
        echo "=== Проверка результатов ==="
        echo "Surefire reports:"
        ls -la target/surefire-reports/ 2>/dev/null || echo "Нет surefire-reports"
        echo ""
        echo "Allure results:"
        ls -la target/allure-results/ 2>/dev/null || echo "Нет allure-results"
        echo ""
        echo "Test reports content:"
        find target/surefire-reports/ -name "*.xml" -exec cat {} \; 2>/dev/null || echo "Нет XML отчетов"
    
    - name: Generate Allure report
      if: success() || failure()
      run: |
        if [ -d "target/allure-results" ] && [ "$(ls -A target/allure-results)" ]; then
          mvn allure:report
          echo "Allure report generated"
        else
          echo "No allure results found"
        fi
    
    - name: Upload reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: |
          target/surefire-reports/
          target/allure-results/
          target/site/allure-maven-plugin/
        if-no-files-found: ignore
